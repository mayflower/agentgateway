apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: be
  namespace: default
spec:
  mcp:
    targets:
      - name: mcp-target
        static:
          host: mcp-app.default.svc.cluster.local
          port: 8000
          protocol: StreamableHTTP
          path: override-sse
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: dex-jwks
  namespace: default
spec:
  static:
    host: dex
    port: 5556
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: dex-mcp-authn-policy
  namespace: default
spec:
  targetRefs:
    - name: be
      kind: AgentgatewayBackend
      group: agentgateway.dev
  backend:
    mcp:
      authentication:
        issuer: http://dex:5556/dex
        jwks:
          jwksPath: dex/keys
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: dex-jwks
        audiences:
          - agentgateway-mcp
        provider: Dex
        resourceMetadata:
          resource: http://localhost:3000/dex/mcp
          scopesSupported: '["openid","email","audience:server:client_id:agentgateway-mcp"]'
          bearerMethodsSupported: '["header"]'

---
